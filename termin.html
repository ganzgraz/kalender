<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Im Kalender speichern – ganzgraz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Zwischenseite für "Im Kalender speichern"-Links aus dem Newsletter.
  In E-Mails gibt es keine Knöpfe mit Funktion, nur Links. Dieser Link trägt alle
  Termindaten in der Adresse; die Seite zeigt den Termin und legt ihn per Klick in
  Google, Apple/Outlook (.ics) oder Outlook.com an. Links baut der Generator
  (nl-link.html). Parameter:
    t  Titel (Pflicht)          d  Datum JJJJ-MM-TT (Pflicht)
    s  Beginn HH:MM             e  Ende HH:MM (nach Mitternacht = Folgetag)
    o  Ort                      a  Adresse
    u  Link zu Infos/Tickets
  Ohne Beginn wird der Termin ganztägig, ohne Ende dauert er zwei Stunden.
-->
<style>
  :root { --p:#4e2996; --fl:#cdb9ee; --po:#f8c99d; --or:#ff8900; --tx:#2b2b2b; --mu:#6f6f6f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; color: var(--tx); background: #faf7ff; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
  .logo { display: inline-block; }
  .logo img { height: 58px; width: auto; display: block; }
  .karte { margin-top: 18px; background: #fff; border: 2px solid var(--fl); border-radius: 18px; padding: 22px 22px 20px; }
  .kicker { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--or); }
  h1 { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 25px; line-height: 1.2; color: var(--p); margin: 6px 0 12px; overflow-wrap: anywhere; }
  .zeile { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; margin-top: 6px; }
  .zeile svg { width: 19px; height: 19px; flex-shrink: 0; margin-top: 2px; color: var(--p); }
  .zeile strong { font-weight: 600; }
  .mehr { display: inline-block; margin-top: 12px; font-weight: 600; color: var(--p); text-decoration: none; border-bottom: 2px solid var(--po); }
  .mehr:hover { color: var(--or); }
  .vorbei { margin-top: 12px; padding: 8px 12px; border-radius: 10px; background: #fff4e8; font-size: 14px; }
  .knoepfe { display: grid; gap: 10px; margin-top: 20px; }
  .knoepfe a { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .01em;
    padding: 14px 18px 12px; border-radius: 999px; border: 2px solid var(--p); color: var(--p); background: #fff; }
  .knoepfe a.primaer { background: var(--p); color: #fff; }
  .knoepfe a:hover { border-color: var(--or); background: var(--or); color: #fff; }
  .knoepfe svg { width: 18px; height: 18px; }
  .hinweis { font-size: 13px; color: var(--mu); margin-top: 10px; text-align: center; }
  .werbung { margin-top: 22px; padding: 18px 20px; border-radius: 16px; background: #f5eefe; border: 2px solid var(--p); }
  .werbung h2 { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 18px; color: var(--p); line-height: 1.25; }
  .werbung p { font-size: 15px; font-style: italic; margin-top: 6px; }
  .werbung .reihe { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .werbung a { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 15px; text-decoration: none;
    padding: 10px 16px 8px; border-radius: 999px; }
  .werbung a.nl { background: var(--or); color: #fff; }
  .werbung a.mb { background: var(--p); color: #fff; }
  .werbung a:hover { filter: brightness(.92); }
  .fuss { margin-top: 20px; text-align: center; font-size: 14px; }
  .fuss a { color: var(--p); font-weight: 600; }
  .fehler { margin-top: 18px; background: #fff; border: 2px solid var(--po); border-radius: 18px; padding: 22px; }
  .fehler h1 { font-size: 21px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="https://ganzgraz.at"><img src="logo.png" alt="ganzgraz – Der Graz-Newsletter mit der Gans"></a>
  <div id="inhalt"></div>
  <div class="werbung">
    <h2>Mehr Grazer Tipps jede Woche – im Graz-Newsletter von ganzgraz.</h2>
    <p>Und weil wir keinem Konzern gehören, gibt es Newsletter und Kalender nur durch deinen freiwilligen Beitrag.</p>
    <div class="reihe">
      <a class="nl" href="https://news.ganzgraz.at" data-z="newsletter">Newsletter abonnieren</a>
      <a class="mb" href="https://ganzgraz.at/mitmachen" data-z="member">Member werden</a>
    </div>
  </div>
  <div class="fuss"><a href="https://ganzgraz.at/eventkalender">Alle Events im ganzgraz-Eventkalender</a></div>
</div>

<script>
const ZAEHL_URL = "https://script.google.com/macros/s/AKfycbyzCdgJfrBRChHAaYqB1Bz4x7Sqz2-lPBnBRlVDmVKyS9ygWdGA_U2LdfS3irW7Uxdc/exec";
const TZ = "Europe/Vienna";
const FUSS = "Mehr Grazer Tipps jede Woche im ganzgraz-Newsletter: https://news.ganzgraz.at\n" +
  "Und weil wir keinem Konzern gehören, gibt es Newsletter und Kalender nur durch deinen freiwilligen Beitrag: https://ganzgraz.at/mitmachen";
const SVG_KAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>';
const SVG_UHR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const SVG_ORT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* Zählung wie im Eventkalender: nur Summen, keine Cookies, keine Personendaten */
function zaehle(typ, titel) {
  try {
    fetch(ZAEHL_URL + "?z=" + encodeURIComponent(typ) + (titel ? "&t=" + encodeURIComponent(String(titel).slice(0, 60)) : ""),
      { mode: "no-cors", keepalive: true, cache: "no-store" });
  } catch (err) {}
}

/* Wiener Ortszeit → echter Zeitpunkt (Sommer-/Winterzeit richtig) */
function wienZeit(tag, h, min) {
  const [y, mo, d] = tag.split("-").map(Number);
  let t = Date.UTC(y, mo - 1, d, h, min);
  for (let i = 0; i < 2; i++) {
    const g = {};
    new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(t)).forEach(p => g[p.type] = p.value);
    t += Date.UTC(y, mo - 1, d, h, min) - Date.UTC(+g.year, +g.month - 1, +g.day, +g.hour, +g.minute);
  }
  return new Date(t);
}
function tagPlus(tag, n) { const d = new Date(tag + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function heuteWien() { return new Intl.DateTimeFormat("sv-SE", { timeZone: TZ }).format(new Date()); }
function fmtTag(tag) {
  return new Intl.DateTimeFormat("de-AT", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" })
    .format(new Date(tag + "T12:00:00Z"));
}
function utcStempel(d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
function datumStempel(k) { return k.replace(/-/g, ""); }

/* ---------- Daten aus dem Link lesen und prüfen ---------- */
function termin() {
  const q = new URLSearchParams(location.search);
  const zeitOk = v => /^([01]?\d|2[0-3]):[0-5]\d$/.test(v || "");
  const t = {
    titel: (q.get("t") || "").trim().slice(0, 200),
    tag: (q.get("d") || "").trim(),
    von: (q.get("s") || "").trim(),
    bis: (q.get("e") || "").trim(),
    ort: (q.get("o") || "").trim().slice(0, 150),
    adresse: (q.get("a") || "").trim().slice(0, 200),
    link: (q.get("u") || "").trim()
  };
  if (!t.titel || !/^\d{4}-\d{2}-\d{2}$/.test(t.tag) || isNaN(Date.parse(t.tag + "T12:00:00Z"))) return null;
  if (!zeitOk(t.von)) t.von = "";
  if (!zeitOk(t.bis) || !t.von) t.bis = "";
  if (t.link && !/^https?:\/\//i.test(t.link)) t.link = "https://" + t.link;
  if (t.link && !/^https?:\/\/[^\s"'<>]+$/i.test(t.link)) t.link = "";
  // Nur echte Webadressen mit Punkt im Hostnamen ("https://javascript:alert(1)" fällt weg)
  if (t.link && !/^https?:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+([\/?#:]|$)/i.test(t.link)) t.link = "";
  if (t.von) {
    const [h, m] = t.von.split(":").map(Number);
    t.start = wienZeit(t.tag, h, m);
    if (t.bis) {
      const [h2, m2] = t.bis.split(":").map(Number);
      t.ende = wienZeit(t.tag, h2, m2);
      if (t.ende <= t.start) t.ende = wienZeit(tagPlus(t.tag, 1), h2, m2);   // nach Mitternacht
    } else {
      t.ende = new Date(t.start.getTime() + 2 * 3600000);
      t.geschaetzt = true;
    }
  } else {
    t.ganztags = true;
  }
  return t;
}

function ortText(t) { return [t.ort, t.adresse].filter(Boolean).join(", "); }
function beschreibung(t) { return (t.link ? t.link + "\n\n" : "") + FUSS; }

function googleLink(t) {
  const dates = t.ganztags ? datumStempel(t.tag) + "/" + datumStempel(tagPlus(t.tag, 1)) : utcStempel(t.start) + "/" + utcStempel(t.ende);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(t.titel) +
    "&dates=" + dates + "&details=" + encodeURIComponent(beschreibung(t)) + "&location=" + encodeURIComponent(ortText(t));
}
function outlookLink(t) {
  const s = t.ganztags ? t.tag : t.start.toISOString(), e = t.ganztags ? tagPlus(t.tag, 1) : t.ende.toISOString();
  return "https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent" +
    "&subject=" + encodeURIComponent(t.titel) + "&startdt=" + encodeURIComponent(s) + "&enddt=" + encodeURIComponent(e) +
    (t.ganztags ? "&allday=true" : "") + "&body=" + encodeURIComponent(beschreibung(t)) + "&location=" + encodeURIComponent(ortText(t));
}
function icsText(t) {
  const x = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const bytes = c => new TextEncoder().encode(c).length;
  const falten = z => { const out = []; let zeile = "", n = 0; for (const c of z) { const b = bytes(c); if (n + b > 74) { out.push(zeile); zeile = " "; n = 1; } zeile += c; n += b; } out.push(zeile); return out.join("\r\n"); };
  // Feste Kennung aus den Termindaten: Zweimal speichern ergibt keinen Doppeleintrag
  let h = 0; const roh = t.titel + "|" + t.tag + "|" + t.von;
  for (let i = 0; i < roh.length; i++) h = (h * 31 + roh.charCodeAt(i)) >>> 0;
  const z = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ganzgraz//Newsletter//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    "UID:nl-" + t.tag.replace(/-/g, "") + "-" + h.toString(36) + "@ganzgraz.at",
    "DTSTAMP:" + utcStempel(new Date()),
    t.ganztags ? "DTSTART;VALUE=DATE:" + datumStempel(t.tag) : "DTSTART:" + utcStempel(t.start),
    t.ganztags ? "DTEND;VALUE=DATE:" + datumStempel(tagPlus(t.tag, 1)) : "DTEND:" + utcStempel(t.ende),
    "SUMMARY:" + x(t.titel), "LOCATION:" + x(ortText(t)), "DESCRIPTION:" + x(beschreibung(t)),
    t.link ? "URL:" + t.link : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean);
  return z.map(falten).join("\r\n") + "\r\n";
}
function dateiname(t) {
  return (t.titel.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "termin") + ".ics";
}

/* ---------- Seite aufbauen ---------- */
const box = document.getElementById("inhalt");
const t = termin();
if (!t) {
  box.innerHTML = '<div class="fehler"><h1>Dieser Link ist unvollständig</h1>' +
    '<p>Hier fehlen Titel oder Datum des Termins. Im Eventkalender findest du alle Events und kannst sie dort direkt speichern.</p>' +
    '<a class="mehr" href="https://ganzgraz.at/eventkalender">Zum Eventkalender</a></div>';
} else {
  document.title = t.titel + " – im Kalender speichern";
  const zeit = t.ganztags ? "ganztägig"
    : t.von + (t.bis ? "–" + t.bis : "") + " Uhr" + (t.bis && t.bis < t.von ? " (bis in die Nacht)" : "");
  const ics = URL.createObjectURL(new Blob([icsText(t)], { type: "text/calendar;charset=utf-8" }));
  box.innerHTML = '<div class="karte">' +
    '<div class="kicker">Im Kalender speichern</div>' +
    '<h1>' + esc(t.titel) + '</h1>' +
    '<div class="zeile">' + SVG_UHR + '<div><strong>' + esc(fmtTag(t.tag)) + '</strong><br>' + esc(zeit) + '</div></div>' +
    (ortText(t) ? '<div class="zeile">' + SVG_ORT + '<div>' + (t.ort ? '<strong>' + esc(t.ort) + '</strong>' : '') +
      (t.ort && t.adresse ? '<br>' : '') + esc(t.adresse) + '</div></div>' : '') +
    (t.link ? '<a class="mehr" href="' + esc(t.link) + '" target="_blank" rel="noopener" data-z="nl_info">Mehr Infos</a>' : '') +
    (t.tag < heuteWien() ? '<div class="vorbei">Dieser Termin ist schon vorbei.</div>' : '') +
    '<div class="knoepfe">' +
      '<a class="primaer" href="' + esc(googleLink(t)) + '" target="_blank" rel="noopener" data-z="nl_google">' + SVG_KAL + 'Google Kalender</a>' +
      '<a href="' + ics + '" download="' + esc(dateiname(t)) + '" data-z="nl_datei">' + SVG_KAL + 'Apple / Outlook</a>' +
      '<a href="' + esc(outlookLink(t)) + '" target="_blank" rel="noopener" data-z="nl_outlook">' + SVG_KAL + 'Outlook.com</a>' +
    '</div>' +
    (t.geschaetzt ? '<div class="hinweis">Kein Ende angegeben – wir tragen zwei Stunden ein.</div>' : '') +
    '</div>';
}

// Aufruf der Seite (= Klick im Newsletter) und zählbare Klicks
if (t) zaehle("nl_offen", t.titel);
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-z]");
  if (el) zaehle(el.dataset.z, t ? t.titel : "");
}, true);
</script>
</body>
</html>
